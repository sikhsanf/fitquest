<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FitQuest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1420;--card:#1a2233;--card2:#263049;--line:#05070c;--txt:#f2efe6;--mut:#8f9ab0;--acc:#ffc933;--acc2:#ff7a45;--bad:#ff5d5d;--good:#6ee07a;--font:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Courier New",monospace;--px:0 0 0 3px var(--line),4px 4px 0 3px var(--line)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);-webkit-font-smoothing:none}
#app{max-width:480px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
h1{font-size:24px;margin:0;letter-spacing:1px;text-transform:uppercase;line-height:1.15}
h2{margin:6px 0 2px;font-size:20px;text-align:center;letter-spacing:.5px}
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--mut);margin:22px 4px 10px}
p{margin:4px 0}.mut{color:var(--mut)}.small{font-size:12px}.center{text-align:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:0}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---- shared pixel UI */
.hdr{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.hdr>div{flex:1}.hdr p{color:var(--mut);font-size:13px}
.ibtn{background:var(--card);box-shadow:var(--px);width:40px;height:40px;font-size:18px;flex:none;margin:0 3px 3px 0}
.ibtn:active{transform:translate(2px,2px);box-shadow:0 0 0 3px var(--line),2px 2px 0 3px var(--line)}
.card{background:var(--card);box-shadow:var(--px),inset 0 0 0 3px var(--card2);padding:16px;margin:0 4px 18px 0}
.btn{background:var(--acc);color:#1a1205;font-weight:800;padding:14px 18px;width:calc(100% - 4px);font-size:15px;text-transform:uppercase;letter-spacing:1.5px;box-shadow:0 0 0 3px var(--line),4px 4px 0 3px var(--line),inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.4)}
.btn.big{padding:18px;font-size:17px;margin-top:8px}
.btn.ghost{background:var(--card);color:var(--txt);box-shadow:var(--px)}.btn.danger{color:var(--bad);margin-top:14px}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 3px var(--line),1px 1px 0 3px var(--line),inset 0 -4px 0 rgba(0,0,0,.25)}
.bar{height:12px;background:#0a0e18;box-shadow:0 0 0 2px var(--line)}.bar i{display:block;height:100%;background:var(--good);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.18) 6px 8px);transition:width .5s steps(12)}
.bar.sm{height:9px;flex:1}.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.chip{font-size:11px;padding:3px 8px;background:var(--card2);color:var(--mut);box-shadow:0 0 0 2px var(--line)}.chip.p{background:#3b3416;color:var(--acc)}
.g{color:var(--good)}.o{color:var(--acc2)}.r{color:var(--bad)}
.tog label{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:12px}.tog input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc)}
.rows>div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px dashed var(--card2)}.rows>div:last-child{border:0}
.stp{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:2px dashed var(--card2)}.stp:last-child{border:0}.stp>div:not(.em){flex:1;min-width:0}.em{font-size:20px;width:28px;text-align:center}
.rt2{text-align:right;flex:none!important;max-width:42%;white-space:normal}.rt2 b{display:block}.rt2 small{color:var(--mut);font-size:11px}

/* ---- sky stage */
.sky{position:relative;overflow:hidden}
.sky.dawn{background:linear-gradient(#27345e 0%,#6b5a8e 36%,#e48a64 72%,#ffc27a 100%)}
.sky.day{background:linear-gradient(#3f9be6,#8ccff4 70%,#d4efff)}
.sky.night{background:linear-gradient(#0a0f2c,#1b2452 70%,#303d78)}
.sky.dawn::before,.sky.night::before{content:"";position:absolute;left:8%;top:10%;width:3px;height:3px;background:#fff;box-shadow:70px 22px #fff,150px -4px #ffe9a8,230px 34px #fff,300px 6px #fff,340px 40px #ffe9a8,40px 60px #fff;opacity:.75}
.sky.day::before{content:"";position:absolute;left:14%;top:16%;width:30px;height:8px;background:#fff;box-shadow:8px -8px #fff,18px -8px #fff,10px 8px #fff,150px 24px #fff,160px 16px #fff,172px 16px #fff,162px 32px #fff}
.stage{margin:0 -16px;padding:12px 16px 0}
.stage .ground{margin:0 -16px}
.ground{height:30px;position:relative;background:linear-gradient(#69b85c 0 6px,#3f7f40 6px 10px,#6a4d38 10px);}
.ground::after{content:"";position:absolute;inset:10px 0 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 4px,transparent 4px 12px)}
.hudbar{display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.lvpill{background:var(--acc);color:#1a1205;font-weight:800;padding:4px 9px;box-shadow:0 0 0 2px var(--line);font-size:14px}
.streak{font-size:14px;font-weight:800;opacity:.5;text-shadow:0 2px 0 #000}.streak.on{opacity:1}
.avwrap{position:relative;width:100%;margin:2px auto -6px;z-index:1}
canvas.av{display:block;height:min(50vh,360px);width:auto;margin:0 auto}
.tag{position:absolute;background:rgba(10,14,24,.86);color:#fff;font-size:11px;font-weight:700;padding:4px 6px 6px;min-width:66px;text-align:left;box-shadow:0 0 0 2px var(--line),2px 2px 0 2px var(--line)}
.tag.l{left:0}.tag.r{right:0}.tag span{display:block;color:var(--mut);font-size:10px;font-weight:400}.tag b{color:var(--acc)}
.tag .tb{display:block;height:3px;background:#2a3550;margin-top:3px}.tag .tb i{display:block;height:100%;background:var(--good)}
.tag.flash{animation:pulse .5s steps(2) 3}
@keyframes pulse{50%{background:var(--acc);color:#000}}
.titleline{text-align:center;margin:14px 0 2px;color:var(--acc);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:13px}
h3.q{text-align:center;font-size:17px;margin:4px 8px 16px;line-height:1.35}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 4px 0 0}
.choice{background:var(--card);box-shadow:var(--px),inset 0 0 0 3px var(--card2);padding:14px 4px 12px;text-align:center;color:var(--txt)}
.choice:active{transform:translate(3px,3px);box-shadow:0 0 0 3px var(--line),1px 1px 0 3px var(--line),inset 0 0 0 3px var(--card2)}
.choice canvas{width:68px;height:68px;display:block;margin:0 auto 6px}.choice b{display:block;font-size:14px;letter-spacing:1px;text-transform:uppercase}.choice small{display:block;color:var(--mut);font-size:11px;margin-top:3px;line-height:1.25}

/* ---- onboarding / reveal / ready */
.obstage{margin:0 -16px;padding-top:16px}.obstage canvas{display:block;height:210px;width:auto;margin:0 auto -4px;position:relative;z-index:1}
.ob h1{margin:20px 0 4px;text-align:center}.ob>p{text-align:center;margin-bottom:18px}
.field{margin:0 4px 14px 0}.field>label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--mut);margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:var(--px);padding:6px}.stepper button{width:44px;height:44px;background:var(--card2);font-size:22px;font-weight:800}.stepper button:active{background:var(--acc);color:#000}
.stepper input{flex:1;min-width:0;background:transparent;border:0;color:var(--txt);font:800 28px var(--font);text-align:right;outline:0;-moz-appearance:textfield}.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper span{color:var(--mut);width:32px}
.skins{display:flex;gap:12px}.skins button{width:48px;height:48px;box-shadow:0 0 0 3px var(--line)}.skins button.on{box-shadow:0 0 0 3px var(--line),0 0 0 6px var(--acc)}
.rv .stagebig{margin:0 -16px;padding-top:22px}.rv canvas.av{height:min(54vh,400px)}
.rvtext{text-align:center;transition:opacity .6s;margin-top:16px}.lvbig{font-size:38px;font-weight:800;color:var(--acc);letter-spacing:3px;text-shadow:3px 3px 0 #000}
.rdy{display:flex;flex-direction:column;min-height:calc(100vh - 32px)}.rdcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.icbig{width:168px;height:168px;margin-bottom:14px}.rdcenter .cap{color:var(--acc);font-weight:800;letter-spacing:1px;text-transform:uppercase}
.camchip{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--px);padding:12px 14px;margin:0 4px 12px 0;font-size:13px}.camchip input{width:24px;height:24px;accent-color:var(--acc);flex:none}

/* ---- summary */
.xp{font-size:44px;font-weight:800;color:var(--acc);margin:4px 0 12px;text-shadow:3px 3px 0 #000}.lvlup{background:var(--acc);color:#1a1205;font-weight:800;padding:10px;margin:0 0 14px}
.ba{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:6px 0}.ba canvas{height:230px;width:auto}.ba .arrow{font-size:28px;color:var(--acc);margin-bottom:100px}
.ba .after{animation:glow 1s steps(4) 3}@keyframes glow{50%{filter:brightness(1.7) drop-shadow(0 0 6px #ffc933)}}
.grow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.grow .gn{width:110px;color:var(--mut)}.grow b{width:46px;text-align:right}

/* ---- runner */
.run{display:flex;flex-direction:column;align-items:stretch;min-height:calc(100vh - 32px)}
.topbar{display:flex;align-items:center;gap:10px}.prog{flex:1;display:flex;gap:3px}.prog i{flex:1;height:8px;background:var(--card2);box-shadow:0 0 0 2px var(--line)}.prog i.done{background:var(--acc)}.prog i.now{background:var(--acc2)}
.phase{text-align:center;margin-top:14px;font-weight:800;letter-spacing:3px;font-size:13px;color:var(--mut)}.phase.work{color:var(--acc)}.phase.rest{color:var(--acc2)}
.timer{text-align:center;font-size:84px;font-weight:800;line-height:1;margin:2px 0 6px;font-variant-numeric:tabular-nums;text-shadow:4px 4px 0 #000}
.sub{text-align:center;color:var(--mut);font-size:14px;padding:0 8px}
.cam{position:relative;width:min(100%,calc(58dvh * var(--arn,1.333)));aspect-ratio:var(--ar,4/3);margin:10px auto;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--line),0 0 0 6px var(--card2)}
.run.camon .timer{font-size:56px;margin:0}.run.camon .sub,.run.camon .chips{display:none}.run.camon .cam{width:min(100%,calc(max(46dvh,calc(100dvh - 330px)) * var(--arn,1.333)));margin:6px auto}
.exov{position:absolute;left:8px;bottom:58px;width:30%;max-width:132px;aspect-ratio:60/66;background:rgba(10,14,28,.62);box-shadow:0 0 0 2px var(--line);z-index:2;pointer-events:none}
.cam .fsbtn{position:absolute;top:6px;right:6px;z-index:3;width:34px;height:34px;background:rgba(0,0,0,.6);color:#fff;font-size:18px;box-shadow:none;padding:0}
.hud #hudTime,.hud #hudName{display:none}.hud #hudTime{font-size:34px}
.cam.full{position:fixed;inset:0;z-index:20;width:100vw;height:100dvh;aspect-ratio:auto;margin:0;box-shadow:none}.cam.full .mirror video,.cam.full .mirror canvas{object-fit:contain}.cam.full .hud #hudTime{display:inline}.cam.full .hud{flex-wrap:wrap;gap:4px}.cam.full .hud #hudName{display:block;width:100%;order:3;text-align:center;font-size:15px;letter-spacing:1px}.cam.full .fsbtn{top:calc(env(safe-area-inset-top,0px) + 8px)}
.restbox{margin:10px 4px 6px}.restbox input[type=range]{width:100%}
.mttiles{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:6px;z-index:3}
.mt-tile{flex:1;background:rgba(0,0,0,.62);color:#fff;text-align:center;padding:6px 2px;font-size:10px;letter-spacing:1px;transition:background .1s}.mt-tile b{display:block;font-size:22px}.mt-tile i{display:block;font-style:normal;font-size:22px;font-weight:800}.mt-tile.hit{background:var(--acc);color:#1a1200}
.mtwalk{position:absolute;top:calc(env(safe-area-inset-top,0px) + 96px);left:8px;right:8px;height:8px;background:rgba(0,0,0,.55);z-index:3}.mtwalk i{display:block;height:100%;width:0;background:var(--acc2);transition:width .15s}
.mtmsg{position:absolute;left:8px;right:8px;bottom:130px;text-align:center;font-size:14px;font-weight:700;padding:8px 10px;background:rgba(0,0,0,.65);color:#fff;z-index:3}
.mtdbg{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 112px);margin:0;font-size:11px;color:#c6f432;background:rgba(0,0,0,.6);padding:6px;white-space:pre-wrap;z-index:3}
.mtctl{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:rgba(0,0,0,.7);padding:8px 10px;z-index:3;color:#fff;font-size:13px}.mtctl input[type=range]{width:100%}.mtbtns{display:flex;gap:6px;margin-top:6px}.mtbtns .btn{flex:1}
.mirror{position:absolute;inset:0;transform:scaleX(-1)}.mirror video,.mirror canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-weight:800;font-size:20px;text-shadow:0 2px 0 #000}
.form{font-size:14px;padding:3px 10px;background:rgba(0,0,0,.6);color:var(--c,#fff)}
.camMsg{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-size:13px;font-weight:700;padding:7px 10px;background:rgba(0,0,0,.65)}.camMsg.bad{color:var(--bad)}
.next{text-align:center;color:var(--mut);font-size:13px;min-height:20px;padding:0 6px}
.ctrl{margin-top:auto;padding-top:14px}
.overlay{position:fixed;inset:0;background:rgba(15,20,32,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;text-align:center;padding:24px}
.spin{width:36px;height:36px;background:var(--acc);animation:sp 1s steps(4) infinite}@keyframes sp{25%{transform:rotate(90deg)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg)}100%{transform:rotate(360deg)}}
.toast{position:fixed;left:16px;right:16px;bottom:24px;max-width:448px;margin:0 auto;background:var(--card2);box-shadow:var(--px);padding:12px 14px;z-index:11;opacity:0;transform:translateY(10px);transition:.25s steps(4);font-size:13px}.toast.show{opacity:1;transform:none}
select{background:var(--card2);color:var(--txt);border:0;box-shadow:0 0 0 2px var(--line);font:inherit;padding:6px}

.pgrid{position:relative;display:flex;justify-content:center;width:calc(100% - 20px);margin:0 auto}
.pgrid canvas.av{height:min(54vh,400px);width:auto;position:relative;z-index:1}
.pgrid svg.pl{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
.pln{fill:none;stroke:#ffc933;stroke-width:2;stroke-dasharray:6 3;opacity:.95}
.pdot{fill:#ffc933;stroke:#150f0b;stroke-width:1.5}
.pln.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:ln .5s steps(10) forwards}
.pdot.draw{opacity:0;animation:pp .1s forwards}
.tag.pop{opacity:0;animation:pp .15s steps(3) forwards}
@keyframes ln{to{stroke-dashoffset:0;stroke-dasharray:6 3}}@keyframes pp{to{opacity:1}}
.pgrid .tag{z-index:3;width:74px;min-width:0}
.lvbig.sm{font-size:28px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--card);color:var(--txt);padding:8px 12px;font-weight:700;font-size:13px;box-shadow:0 0 0 2px var(--line)}
.opts button.on{background:var(--acc);color:#1a1200}
.camp{margin:0 -16px}.camp .hudbar{padding:10px 16px}
.campwrap{position:relative;width:100%;line-height:0}
.campwrap #campc{width:100%;height:auto;display:block}
.campwrap .campav{position:absolute;left:36%;bottom:5%;height:84%;width:auto}
.campname{position:absolute;left:12px;bottom:8px;font-size:11px;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:2px 2px 0 #000;line-height:1}
.scrap{font-size:13px;font-weight:800;color:#ffd78a;padding:0 6px;white-space:nowrap}
.btn.play{margin-top:14px;font-size:20px;letter-spacing:2px}.btn.play small{display:block;font-size:11px;letter-spacing:0;font-weight:600;opacity:.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.invite{margin:16px 0 4px;padding:12px 14px;background:#2a1313;box-shadow:0 0 0 3px #ff5a3c;display:block}
.invite b{display:block;font-size:16px;color:#ffb199;line-height:1.25}.invite span{display:block;margin-top:4px;font-size:13px;color:#e8d0c8}
.invite.hot{animation:warn 1.1s steps(2) infinite}.invite.ok{background:#12261a;box-shadow:0 0 0 3px #6ed36e}.invite.ok b{color:#b6f2b6}
@keyframes warn{50%{box-shadow:0 0 0 3px #ffc933}}
.choice canvas{width:72px;height:90px}
.choice.m-api{box-shadow:var(--px),inset 0 0 0 3px #ff7a2e}
.icbig{width:150px;height:188px;image-rendering:pixelated}
.pstat{display:flex;justify-content:space-around;font-weight:800}
.zone{display:block;width:100%;text-align:left;background:var(--card);color:var(--txt);padding:12px 14px;margin:10px 0;box-shadow:var(--px)}
.zone .zt{display:flex;justify-content:space-between;align-items:center;font-size:16px}.zone .zlv{color:var(--acc);font-weight:800;font-size:13px}
.zone .zr{color:#ffd78a;margin-top:4px}.zone.lock{opacity:.5}
.gm{display:flex;flex-direction:column;gap:12px;margin:0 -16px}
.gm canvas.gc{width:100%;height:auto;image-rendering:pixelated;display:block;background:#000}
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}.modesw button{padding:12px 6px;font-weight:800;background:var(--card2,#2a3550);color:#cfd6e6;box-shadow:var(--px)}.modesw button.on{background:#c6f432;color:#10131f}.modesw small{display:block;font-weight:600;opacity:.75;font-size:10px}
.fpsbox{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center}
.fpsbox canvas.fc{width:100%;max-height:100dvh;image-rendering:pixelated;display:block;background:#000}
.fpip{position:absolute;right:8px;top:30px;width:26%;max-width:150px;aspect-ratio:4/3;overflow:hidden;box-shadow:0 0 0 2px var(--line,#445);background:#111}
.fpip .mirror{position:relative;width:100%;height:100%;transform:scaleX(-1)}.fpip video,.fpip canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fmsg{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:800;font-size:22px;color:#c6f432;text-shadow:0 2px 0 #000;padding:0 16px}
.fq{position:absolute;left:8px;top:22px}.fq2{position:absolute;left:58px;top:22px}.fdbg{position:absolute;left:8px;top:74px;max-width:62%;margin:0;padding:6px;background:rgba(0,0,0,.72);color:#c6f432;font:10px/1.35 monospace;white-space:pre-wrap;pointer-events:none}
.fkeys{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.fkeys .gbtn{padding:14px 2px;font-size:12px}.fkeys.small{opacity:.35}
.gctl{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;padding:0 16px}
.gbtn{padding:18px 6px;font-weight:800;font-size:15px;background:var(--card2,#2a3550);color:#fff;box-shadow:var(--px);touch-action:manipulation;user-select:none}
.gbtn.atk{background:#c0392b;font-size:18px}.gbtn.flee{background:#3a3a46}
.rescard{background:#10162a;box-shadow:0 0 0 3px var(--acc);padding:20px;max-width:340px;text-align:center}
.rescard h2{margin:0 0 8px;color:var(--acc)}.overlay.res{display:flex;align-items:center;justify-content:center}
.rescard .btn{margin-top:10px;width:100%}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2a3550}.item:last-child{border:0}
.item.eq b{color:var(--acc)}.tagok{color:var(--good);font-weight:800;font-size:12px}
.btn.mini{padding:8px 12px;font-size:13px;width:auto}.btn.dis{opacity:.45}
.scrapgain{color:#ffd78a;font-weight:800;font-size:18px;margin-top:2px}

.txt{width:100%;padding:12px;background:var(--card);color:var(--txt);border:0;box-shadow:0 0 0 2px var(--line);font-size:16px;font-weight:700}
.opts.icons button{width:62px;height:58px;padding:3px;display:flex;align-items:center;justify-content:center}
.opts.icons canvas{max-width:100%;max-height:100%;width:auto;height:100%;image-rendering:pixelated}
.opts.icons button.on{box-shadow:0 0 0 3px var(--acc);background:#2a3550}
.skillrow{display:flex;gap:8px;padding:0 16px;flex-wrap:wrap}
.sk{position:relative;flex:1 1 70px;min-width:70px;padding:8px 4px;background:#2a3550;color:#fff;box-shadow:var(--px);overflow:hidden;touch-action:manipulation;user-select:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.sk span{font-size:24px;line-height:1}.sk small{font-size:10px;font-weight:700;text-align:center;line-height:1.1}
.sk .cdv{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(0,0,0,.62);pointer-events:none}
.sk.cd{opacity:.7}
.gctl{grid-template-columns:1fr 1fr}
.witem{border-bottom:1px solid #2a3550;padding-bottom:4px}.witem:last-child{border:0}.witem .item{border:0}
.tree{margin:0 0 8px;font-size:13px}.tree summary{color:var(--acc);font-weight:700;padding:4px 0;cursor:pointer}
.node{display:flex;gap:8px;padding:6px 0 6px 4px;align-items:flex-start}.node.ch{margin-left:18px;border-left:2px solid #2a3550;padding-left:10px}
.node .ne{font-size:20px;width:26px;text-align:center}.node.lk{opacity:.65}.node .why{color:#ffb199}

.camstat{display:flex;flex-direction:column;align-items:center;gap:4px;margin:8px auto 0;padding:8px 12px;max-width:420px;text-align:center;box-shadow:0 0 0 2px var(--line);background:#141b2e}
.camstat .cs{font-weight:800;font-size:13px;letter-spacing:1px}.camstat small{font-size:12px;color:var(--mut)}
.camstat.on{box-shadow:0 0 0 2px #6ed36e}.camstat .cs.on{color:#8cf28c}.camstat.fail{box-shadow:0 0 0 2px #ff6b6b}.camstat .cs.bad{color:#ff8a8a}.camstat .cs.warn{color:var(--acc)}.camstat .cs.off{color:var(--mut)}
.camstat .dot{display:inline-block;width:10px;height:10px;background:#6ed36e;margin-right:6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.exstage{position:relative;margin:10px auto;width:100%;max-width:420px;background:linear-gradient(#1a2238,#10162a);box-shadow:0 0 0 2px var(--line);padding:10px 0 0;text-align:center}
.exv{height:230px;width:auto;image-rendering:pixelated;display:block;margin:0 auto}
.exhint{font-size:12px;color:var(--mut);padding:6px 0;border-top:6px solid #3a3128;background:#1c1814}
.slrow{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;font-size:14px}.slrow b{color:var(--acc);font-size:12px}
input[type=range]{width:100%;accent-color:#ffc933;height:28px}
.btn.wide{width:100%;margin:2px 0 6px}
.wtabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.wtab{flex:0 0 auto;min-width:68px;padding:8px 6px;background:var(--card);color:var(--txt);box-shadow:0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.wtab span{font-size:22px}.wtab small{font-size:10px;font-weight:700}.wtab.on{box-shadow:0 0 0 3px var(--acc);background:#2a3550}
.stree,.stree ul{list-style:none;margin:0;padding:0}.stree ul{margin-left:18px;padding-left:10px;border-left:2px solid #3a4a6e}
.stree li{margin-top:10px;position:relative}.stree ul>li::before{content:"";position:absolute;left:-10px;top:22px;width:10px;border-top:2px solid #3a4a6e}
.sn{display:flex;gap:10px;align-items:flex-start;padding:10px;background:#141b2e;box-shadow:0 0 0 2px #2a3550}
.sn.ok{box-shadow:0 0 0 2px #6ed36e}.sn.lk{opacity:.7}.sn .se{font-size:26px;width:32px;text-align:center}.sn .sb b{font-size:14px}.sreq{color:#ffb199;margin-top:2px}.sreq.g{color:#8cf28c}

#splash{position:fixed;inset:0;z-index:9999;background:#0e1116;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-by{font-size:20px;letter-spacing:6px;color:#8a93a6;opacity:0;animation:spin .7s .2s forwards}
#splash .sp-brand{font-size:40px;font-weight:700;letter-spacing:3px;margin-top:6px;color:#ffd23f;text-shadow:3px 3px 0 #000;opacity:0;animation:spin .8s .6s forwards}
#splash .sp-line{width:0;height:4px;background:linear-gradient(90deg,#ff8a2a,#ffd23f);margin:18px 0;animation:spl 1s 1.1s forwards}
#splash .sp-game{font-size:15px;letter-spacing:8px;color:#e8e6df;opacity:0;animation:spin .7s 1.5s forwards}
#splash .sp-skip{position:absolute;bottom:28px;font-size:11px;letter-spacing:2px;color:#4c5568}
@keyframes spin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spl{to{width:150px}}
</style>
</head>
<body>
<div id="splash"><div class="sp-by">(ayah)</div><div class="sp-brand">learnersfam</div><div class="sp-line"></div><div class="sp-game">FITQUEST</div><div class="sp-skip">tap untuk lanjut</div></div>
<div id="app"></div>
<script>(function(){var s=document.getElementById("splash");if(!s)return;var d=function(){s.classList.add("out");setTimeout(function(){s.remove()},700)};s.onclick=d;setTimeout(d,2900)})()</script>
<script src="data.js"></script>
<script src="detectors.js"></script>
<script src="avatar.js"></script>
<script src="exanim.js"></script>
<script src="music.js"></script>
<script src="motion.js"></script>
<script src="game.js"></script>
<script src="fps.js"></script>
<script src="app.js"></script>
</body>
</html>
