<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FitQuest</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--card2:#263049;--line:#05070c;--txt:#f2efe6;--mut:#8f9ab0;--acc:#ffc933;--acc2:#ff7a45;--bad:#ff5d5d;--good:#6ee07a;--font:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Courier New",monospace;--px:0 0 0 3px var(--line),4px 4px 0 3px var(--line)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);-webkit-font-smoothing:none}
#app{max-width:480px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
h1{font-size:24px;margin:0;letter-spacing:1px;text-transform:uppercase;line-height:1.15}
h2{margin:6px 0 2px;font-size:20px;text-align:center;letter-spacing:.5px}
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--mut);margin:22px 4px 10px}
p{margin:4px 0}.mut{color:var(--mut)}.small{font-size:12px}.center{text-align:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:0}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---- shared pixel UI */
.hdr{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.hdr>div{flex:1}.hdr p{color:var(--mut);font-size:13px}
.ibtn{background:var(--card);box-shadow:var(--px);width:40px;height:40px;font-size:18px;flex:none;margin:0 3px 3px 0}
.ibtn:active{transform:translate(2px,2px);box-shadow:0 0 0 3px var(--line),2px 2px 0 3px var(--line)}
.card{background:var(--card);box-shadow:var(--px),inset 0 0 0 3px var(--card2);padding:16px;margin:0 4px 18px 0}
.btn{background:var(--acc);color:#1a1205;font-weight:800;padding:14px 18px;width:calc(100% - 4px);font-size:15px;text-transform:uppercase;letter-spacing:1.5px;box-shadow:0 0 0 3px var(--line),4px 4px 0 3px var(--line),inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.4)}
.btn.big{padding:18px;font-size:17px;margin-top:8px}
.btn.ghost{background:var(--card);color:var(--txt);box-shadow:var(--px)}.btn.danger{color:var(--bad);margin-top:14px}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 3px var(--line),1px 1px 0 3px var(--line),inset 0 -4px 0 rgba(0,0,0,.25)}
.bar{height:12px;background:#0a0e18;box-shadow:0 0 0 2px var(--line)}.bar i{display:block;height:100%;background:var(--good);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.18) 6px 8px);transition:width .5s steps(12)}
.bar.sm{height:9px;flex:1}.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.chip{font-size:11px;padding:3px 8px;background:var(--card2);color:var(--mut);box-shadow:0 0 0 2px var(--line)}.chip.p{background:#3b3416;color:var(--acc)}
.g{color:var(--good)}.o{color:var(--acc2)}.r{color:var(--bad)}
.tog label{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:12px}.tog input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc)}
.rows>div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px dashed var(--card2)}.rows>div:last-child{border:0}
.stp{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:2px dashed var(--card2)}.stp:last-child{border:0}.stp>div:not(.em){flex:1;min-width:0}.em{font-size:20px;width:28px;text-align:center}
.rt2{text-align:right;flex:none!important;max-width:42%;white-space:normal}.rt2 b{display:block}.rt2 small{color:var(--mut);font-size:11px}

/* ---- sky stage */
.sky{position:relative;overflow:hidden}
.sky.dawn{background:linear-gradient(#27345e 0%,#6b5a8e 36%,#e48a64 72%,#ffc27a 100%)}
.sky.day{background:linear-gradient(#3f9be6,#8ccff4 70%,#d4efff)}
.sky.night{background:linear-gradient(#0a0f2c,#1b2452 70%,#303d78)}
.sky.dawn::before,.sky.night::before{content:"";position:absolute;left:8%;top:10%;width:3px;height:3px;background:#fff;box-shadow:70px 22px #fff,150px -4px #ffe9a8,230px 34px #fff,300px 6px #fff,340px 40px #ffe9a8,40px 60px #fff;opacity:.75}
.sky.day::before{content:"";position:absolute;left:14%;top:16%;width:30px;height:8px;background:#fff;box-shadow:8px -8px #fff,18px -8px #fff,10px 8px #fff,150px 24px #fff,160px 16px #fff,172px 16px #fff,162px 32px #fff}
.stage{margin:0 -16px;padding:12px 16px 0}
.stage .ground{margin:0 -16px}
.ground{height:30px;position:relative;background:linear-gradient(#69b85c 0 6px,#3f7f40 6px 10px,#6a4d38 10px);}
.ground::after{content:"";position:absolute;inset:10px 0 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 4px,transparent 4px 12px)}
.hudbar{display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.lvpill{background:var(--acc);color:#1a1205;font-weight:800;padding:4px 9px;box-shadow:0 0 0 2px var(--line);font-size:14px}
.streak{font-size:14px;font-weight:800;opacity:.5;text-shadow:0 2px 0 #000}.streak.on{opacity:1}
.avwrap{position:relative;width:100%;margin:2px auto -6px;z-index:1}
canvas.av{display:block;height:min(50vh,360px);width:auto;margin:0 auto}
.tag{position:absolute;background:rgba(10,14,24,.86);color:#fff;font-size:11px;font-weight:700;padding:4px 6px 6px;min-width:66px;text-align:left;box-shadow:0 0 0 2px var(--line),2px 2px 0 2px var(--line)}
.tag.l{left:0}.tag.r{right:0}.tag span{display:block;color:var(--mut);font-size:10px;font-weight:400}.tag b{color:var(--acc)}
.tag .tb{display:block;height:3px;background:#2a3550;margin-top:3px}.tag .tb i{display:block;height:100%;background:var(--good)}
.tag.flash{animation:pulse .5s steps(2) 3}
@keyframes pulse{50%{background:var(--acc);color:#000}}
.titleline{text-align:center;margin:14px 0 2px;color:var(--acc);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:13px}
h3.q{text-align:center;font-size:17px;margin:4px 8px 16px;line-height:1.35}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 4px 0 0}
.choice{background:var(--card);box-shadow:var(--px),inset 0 0 0 3px var(--card2);padding:14px 4px 12px;text-align:center;color:var(--txt)}
.choice:active{transform:translate(3px,3px);box-shadow:0 0 0 3px var(--line),1px 1px 0 3px var(--line),inset 0 0 0 3px var(--card2)}
.choice canvas{width:68px;height:68px;display:block;margin:0 auto 6px}.choice b{display:block;font-size:14px;letter-spacing:1px;text-transform:uppercase}.choice small{display:block;color:var(--mut);font-size:11px;margin-top:3px;line-height:1.25}

/* ---- onboarding / reveal / ready */
.obstage{margin:0 -16px;padding-top:16px}.obstage canvas{display:block;height:210px;width:auto;margin:0 auto -4px;position:relative;z-index:1}
.ob h1{margin:20px 0 4px;text-align:center}.ob>p{text-align:center;margin-bottom:18px}
.field{margin:0 4px 14px 0}.field>label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--mut);margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:var(--px);padding:6px}.stepper button{width:44px;height:44px;background:var(--card2);font-size:22px;font-weight:800}.stepper button:active{background:var(--acc);color:#000}
.stepper input{flex:1;min-width:0;background:transparent;border:0;color:var(--txt);font:800 28px var(--font);text-align:right;outline:0;-moz-appearance:textfield}.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper span{color:var(--mut);width:32px}
.skins{display:flex;gap:12px}.skins button{width:48px;height:48px;box-shadow:0 0 0 3px var(--line)}.skins button.on{box-shadow:0 0 0 3px var(--line),0 0 0 6px var(--acc)}
.rv .stagebig{margin:0 -16px;padding-top:22px}.rv canvas.av{height:min(54vh,400px)}
.rvtext{text-align:center;transition:opacity .6s;margin-top:16px}.lvbig{font-size:38px;font-weight:800;color:var(--acc);letter-spacing:3px;text-shadow:3px 3px 0 #000}
.rdy{display:flex;flex-direction:column;min-height:calc(100vh - 32px)}.rdcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.icbig{width:168px;height:168px;margin-bottom:14px}.rdcenter .cap{color:var(--acc);font-weight:800;letter-spacing:1px;text-transform:uppercase}
.camchip{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--px);padding:12px 14px;margin:0 4px 12px 0;font-size:13px}.camchip input{width:24px;height:24px;accent-color:var(--acc);flex:none}

/* ---- summary */
.xp{font-size:44px;font-weight:800;color:var(--acc);margin:4px 0 12px;text-shadow:3px 3px 0 #000}.lvlup{background:var(--acc);color:#1a1205;font-weight:800;padding:10px;margin:0 0 14px}
.ba{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:6px 0}.ba canvas{height:230px;width:auto}.ba .arrow{font-size:28px;color:var(--acc);margin-bottom:100px}
.ba .after{animation:glow 1s steps(4) 3}@keyframes glow{50%{filter:brightness(1.7) drop-shadow(0 0 6px #ffc933)}}
.grow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.grow .gn{width:110px;color:var(--mut)}.grow b{width:46px;text-align:right}

/* ---- runner */
.run{display:flex;flex-direction:column;align-items:stretch;min-height:calc(100vh - 32px)}
.topbar{display:flex;align-items:center;gap:10px}.prog{flex:1;display:flex;gap:3px}.prog i{flex:1;height:8px;background:var(--card2);box-shadow:0 0 0 2px var(--line)}.prog i.done{background:var(--acc)}.prog i.now{background:var(--acc2)}
.phase{text-align:center;margin-top:14px;font-weight:800;letter-spacing:3px;font-size:13px;color:var(--mut)}.phase.work{color:var(--acc)}.phase.rest{color:var(--acc2)}
.timer{text-align:center;font-size:84px;font-weight:800;line-height:1;margin:2px 0 6px;font-variant-numeric:tabular-nums;text-shadow:4px 4px 0 #000}
.sub{text-align:center;color:var(--mut);font-size:14px;padding:0 8px}
.cam{position:relative;height:56vh;height:56dvh;aspect-ratio:var(--ar,3/4);max-width:100%;margin:10px auto;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--line),0 0 0 6px var(--card2)}
.run.camon .timer{font-size:56px;margin:0}.run.camon .sub,.run.camon .chips{display:none}.run.camon .cam{height:max(46vh,calc(100vh - 330px));height:max(46dvh,calc(100dvh - 330px));max-height:74dvh;margin:6px auto}
.mirror{position:absolute;inset:0;transform:scaleX(-1)}.mirror video,.mirror canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-weight:800;font-size:20px;text-shadow:0 2px 0 #000}
.form{font-size:14px;padding:3px 10px;background:rgba(0,0,0,.6);color:var(--c,#fff)}
.camMsg{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-size:13px;font-weight:700;padding:7px 10px;background:rgba(0,0,0,.65)}.camMsg.bad{color:var(--bad)}
.next{text-align:center;color:var(--mut);font-size:13px;min-height:20px;padding:0 6px}
.ctrl{margin-top:auto;padding-top:14px}
.overlay{position:fixed;inset:0;background:rgba(15,20,32,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;text-align:center;padding:24px}
.spin{width:36px;height:36px;background:var(--acc);animation:sp 1s steps(4) infinite}@keyframes sp{25%{transform:rotate(90deg)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg)}100%{transform:rotate(360deg)}}
.toast{position:fixed;left:16px;right:16px;bottom:24px;max-width:448px;margin:0 auto;background:var(--card2);box-shadow:var(--px);padding:12px 14px;z-index:11;opacity:0;transform:translateY(10px);transition:.25s steps(4);font-size:13px}.toast.show{opacity:1;transform:none}
select{background:var(--card2);color:var(--txt);border:0;box-shadow:0 0 0 2px var(--line);font:inherit;padding:6px}

.pgrid{position:relative;display:flex;justify-content:center;width:calc(100% - 20px);margin:0 auto}
.pgrid canvas.av{height:min(54vh,400px);width:auto;position:relative;z-index:1}
.pgrid svg.pl{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
.pln{fill:none;stroke:#ffc933;stroke-width:2;stroke-dasharray:6 3;opacity:.95}
.pdot{fill:#ffc933;stroke:#150f0b;stroke-width:1.5}
.pln.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:ln .5s steps(10) forwards}
.pdot.draw{opacity:0;animation:pp .1s forwards}
.tag.pop{opacity:0;animation:pp .15s steps(3) forwards}
@keyframes ln{to{stroke-dashoffset:0;stroke-dasharray:6 3}}@keyframes pp{to{opacity:1}}
.pgrid .tag{z-index:3;width:74px;min-width:0}
.lvbig.sm{font-size:28px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--card);color:var(--txt);padding:8px 12px;font-weight:700;font-size:13px;box-shadow:0 0 0 2px var(--line)}
.opts button.on{background:var(--acc);color:#1a1200}
.camp{margin:0 -16px}.camp .hudbar{padding:10px 16px}
.campwrap{position:relative;width:100%;line-height:0}
.campwrap #campc{width:100%;height:auto;display:block}
.campwrap .campav{position:absolute;left:36%;bottom:5%;height:84%;width:auto}
.campname{position:absolute;left:12px;bottom:8px;font-size:11px;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:2px 2px 0 #000;line-height:1}
.scrap{font-size:13px;font-weight:800;color:#ffd78a;padding:0 6px;white-space:nowrap}
.btn.play{margin-top:14px;font-size:20px;letter-spacing:2px}.btn.play small{display:block;font-size:11px;letter-spacing:0;font-weight:600;opacity:.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.invite{margin:16px 0 4px;padding:12px 14px;background:#2a1313;box-shadow:0 0 0 3px #ff5a3c;display:block}
.invite b{display:block;font-size:16px;color:#ffb199;line-height:1.25}.invite span{display:block;margin-top:4px;font-size:13px;color:#e8d0c8}
.invite.hot{animation:warn 1.1s steps(2) infinite}.invite.ok{background:#12261a;box-shadow:0 0 0 3px #6ed36e}.invite.ok b{color:#b6f2b6}
@keyframes warn{50%{box-shadow:0 0 0 3px #ffc933}}
.choice canvas{width:72px;height:90px}
.choice.m-api{box-shadow:var(--px),inset 0 0 0 3px #ff7a2e}
.icbig{width:150px;height:188px;image-rendering:pixelated}
.pstat{display:flex;justify-content:space-around;font-weight:800}
.zone{display:block;width:100%;text-align:left;background:var(--card);color:var(--txt);padding:12px 14px;margin:10px 0;box-shadow:var(--px)}
.zone .zt{display:flex;justify-content:space-between;align-items:center;font-size:16px}.zone .zlv{color:var(--acc);font-weight:800;font-size:13px}
.zone .zr{color:#ffd78a;margin-top:4px}.zone.lock{opacity:.5}
.gm{display:flex;flex-direction:column;gap:12px;margin:0 -16px}
.gm canvas.gc{width:100%;height:auto;image-rendering:pixelated;display:block;background:#000}
.gctl{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;padding:0 16px}
.gbtn{padding:18px 6px;font-weight:800;font-size:15px;background:var(--card2,#2a3550);color:#fff;box-shadow:var(--px);touch-action:manipulation;user-select:none}
.gbtn.atk{background:#c0392b;font-size:18px}.gbtn.flee{background:#3a3a46}
.rescard{background:#10162a;box-shadow:0 0 0 3px var(--acc);padding:20px;max-width:340px;text-align:center}
.rescard h2{margin:0 0 8px;color:var(--acc)}.overlay.res{display:flex;align-items:center;justify-content:center}
.rescard .btn{margin-top:10px;width:100%}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2a3550}.item:last-child{border:0}
.item.eq b{color:var(--acc)}.tagok{color:var(--good);font-weight:800;font-size:12px}
.btn.mini{padding:8px 12px;font-size:13px;width:auto}.btn.dis{opacity:.45}
.scrapgain{color:#ffd78a;font-weight:800;font-size:18px;margin-top:2px}

.txt{width:100%;padding:12px;background:var(--card);color:var(--txt);border:0;box-shadow:0 0 0 2px var(--line);font-size:16px;font-weight:700}
.opts.icons button{width:62px;height:58px;padding:3px;display:flex;align-items:center;justify-content:center}
.opts.icons canvas{max-width:100%;max-height:100%;width:auto;height:100%;image-rendering:pixelated}
.opts.icons button.on{box-shadow:0 0 0 3px var(--acc);background:#2a3550}
.skillrow{display:flex;gap:8px;padding:0 16px;flex-wrap:wrap}
.sk{position:relative;flex:1 1 70px;min-width:70px;padding:8px 4px;background:#2a3550;color:#fff;box-shadow:var(--px);overflow:hidden;touch-action:manipulation;user-select:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.sk span{font-size:24px;line-height:1}.sk small{font-size:10px;font-weight:700;text-align:center;line-height:1.1}
.sk .cdv{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(0,0,0,.62);pointer-events:none}
.sk.cd{opacity:.7}
.gctl{grid-template-columns:1fr 1fr}
.witem{border-bottom:1px solid #2a3550;padding-bottom:4px}.witem:last-child{border:0}.witem .item{border:0}
.tree{margin:0 0 8px;font-size:13px}.tree summary{color:var(--acc);font-weight:700;padding:4px 0;cursor:pointer}
.node{display:flex;gap:8px;padding:6px 0 6px 4px;align-items:flex-start}.node.ch{margin-left:18px;border-left:2px solid #2a3550;padding-left:10px}
.node .ne{font-size:20px;width:26px;text-align:center}.node.lk{opacity:.65}.node .why{color:#ffb199}

.camstat{display:flex;flex-direction:column;align-items:center;gap:4px;margin:8px auto 0;padding:8px 12px;max-width:420px;text-align:center;box-shadow:0 0 0 2px var(--line);background:#141b2e}
.camstat .cs{font-weight:800;font-size:13px;letter-spacing:1px}.camstat small{font-size:12px;color:var(--mut)}
.camstat.on{box-shadow:0 0 0 2px #6ed36e}.camstat .cs.on{color:#8cf28c}.camstat.fail{box-shadow:0 0 0 2px #ff6b6b}.camstat .cs.bad{color:#ff8a8a}.camstat .cs.warn{color:var(--acc)}.camstat .cs.off{color:var(--mut)}
.camstat .dot{display:inline-block;width:10px;height:10px;background:#6ed36e;margin-right:6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.exstage{position:relative;margin:10px auto;width:100%;max-width:420px;background:linear-gradient(#1a2238,#10162a);box-shadow:0 0 0 2px var(--line);padding:10px 0 0;text-align:center}
.exv{height:230px;width:auto;image-rendering:pixelated;display:block;margin:0 auto}
.exhint{font-size:12px;color:var(--mut);padding:6px 0;border-top:6px solid #3a3128;background:#1c1814}
.slrow{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;font-size:14px}.slrow b{color:var(--acc);font-size:12px}
input[type=range]{width:100%;accent-color:#ffc933;height:28px}
.btn.wide{width:100%;margin:2px 0 6px}
.wtabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.wtab{flex:0 0 auto;min-width:68px;padding:8px 6px;background:var(--card);color:var(--txt);box-shadow:0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.wtab span{font-size:22px}.wtab small{font-size:10px;font-weight:700}.wtab.on{box-shadow:0 0 0 3px var(--acc);background:#2a3550}
.stree,.stree ul{list-style:none;margin:0;padding:0}.stree ul{margin-left:18px;padding-left:10px;border-left:2px solid #3a4a6e}
.stree li{margin-top:10px;position:relative}.stree ul>li::before{content:"";position:absolute;left:-10px;top:22px;width:10px;border-top:2px solid #3a4a6e}
.sn{display:flex;gap:10px;align-items:flex-start;padding:10px;background:#141b2e;box-shadow:0 0 0 2px #2a3550}
.sn.ok{box-shadow:0 0 0 2px #6ed36e}.sn.lk{opacity:.7}.sn .se{font-size:26px;width:32px;text-align:center}.sn .sb b{font-size:14px}.sreq{color:#ffb199;margin-top:2px}.sreq.g{color:#8cf28c}

#splash{position:fixed;inset:0;z-index:9999;background:#0e1116;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}

<script>
/* FitQuest — pose detectors (pure logic, no DOM). Input: MediaPipe Pose landmarks. */
(function (root) {
  'use strict';
  const I = { nose: 0, lsh: 11, rsh: 12, lel: 13, rel: 14, lwr: 15, rwr: 16, lhip: 23, rhip: 24, lkn: 25, rkn: 26, lan: 27, ran: 28 };
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
  const vis = (p) => !!p && (p.visibility === undefined || p.visibility >= 0.5);
  const MISSING = 'Mundur sedikit — seluruh badan harus masuk frame';

  function ang(a, b, c) {
    const v1 = [a.x - b.x, a.y - b.y, a.z - b.z];
    const v2 = [c.x - b.x, c.y - b.y, c.z - b.z];
    const n = Math.hypot(...v1) * Math.hypot(...v2);
    if (!n) return null;
    const d = v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2];
    return (Math.acos(clamp(d / n, -1, 1)) * 180) / Math.PI;
  }
  const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);

  class EMA {
    constructor(a) { this.a = a; this.v = null; }
    push(x) { this.v = this.v === null ? x : this.v + this.a * (x - this.v); return this.v; }
    reset() { this.v = null; }
  }

  // pick the body side (l/r) whose required joints are all visible, preferring higher visibility
  function bestSide(f, names) {
    let best = null, bestV = -1;
    for (const s of ['l', 'r']) {
      const pts = names.map((n) => f.img[I[s + n]]);
      if (!pts.every(vis)) continue;
      const v = pts.reduce((a, p) => a + (p.visibility === undefined ? 1 : p.visibility), 0);
      if (v > bestV) { bestV = v; best = s; }
    }
    return best;
  }
  const W = (f, s, n) => f.world[I[s + n]];

  /* ---------- generic rep detector (hysteresis on one smoothed signal) ---------- */
  function repDetector(cfg) {
    const sm = new EMA(cfg.alpha || 0.5);
    let s;
    function reset() {
      sm.reset();
      s = { phase: 'up', min: 999, aux: [], reps: 0, qs: [], seen: 0, lastQ: null, msg: cfg.startMsg || 'Mulai gerak!' };
    }
    reset();
    return {
      kind: 'reps',
      reset,
      update(f) {
        const m = cfg.measure(f);
        if (!m) return { ok: false, msg: MISSING, reps: s.reps, phase: s.phase, live: s.lastQ };
        s.seen++;
        const v = sm.push(m.value);
        if (s.phase === 'up' && v < cfg.down) { s.phase = 'down'; s.min = v; s.aux = []; }
        if (s.phase === 'down') {
          s.min = Math.min(s.min, v);
          if (m.aux !== undefined) s.aux.push(m.aux);
          if (v > cfg.up) {
            const q = Math.round(cfg.quality(s.min, s.aux));
            s.qs.push(q); s.reps++; s.phase = 'up'; s.lastQ = q;
            s.msg = q >= 80 ? 'Mantap! 🔥' : q >= 55 ? 'Oke — ' + cfg.coach : cfg.coach;
          }
        }
        return { ok: true, msg: s.msg, reps: s.reps, phase: s.phase, live: s.lastQ, lastQ: s.lastQ };
      },
      result() {
        return { score: s.qs.length ? Math.round(avg(s.qs)) : 0, reps: s.reps, coverage: null, eligible: s.reps >= 2 };
      },
    };
  }

  /* ---------- generic hold detector (posture quality over time, inside a time window) ---------- */
  function holdDetector(cfg) {
    let st;
    const reset = () => { st = { tracked: 0, good: 0, last: null }; };
    reset();
    return {
      kind: 'hold',
      reset,
      update(f, t) {
        const dt = st.last == null ? 0 : clamp(t - st.last, 0, 0.25);
        st.last = t;
        if (t < cfg.window[0] || t >= cfg.window[1]) return { ok: true, scored: false, msg: cfg.afterMsg, reps: null, live: null };
        const m = cfg.measure(f);
        if (!m) return { ok: false, scored: true, msg: MISSING, reps: null, live: null };
        st.tracked += dt;
        if (m.good) st.good += dt;
        return { ok: true, scored: true, good: m.good, msg: m.msg, reps: null, live: m.good ? 100 : 40 };
      },
      result() {
        const winLen = cfg.window[1] - cfg.window[0];
        const cov = clamp(st.tracked / winLen);
        return { score: st.tracked > 0 ? Math.round((100 * st.good) / st.tracked) : 0, reps: null, coverage: cov, eligible: cov >= 0.5 };
      },
    };
  }

  /* ---------- exercises ---------- */
  function squat() {
    return repDetector({
      alpha: 0.5, down: 135, up: 158, coach: 'turun lebih dalam',
      measure(f) {
        const a = [];
        for (const s of ['l', 'r']) {
          if (['hip', 'kn', 'an'].every((n) => vis(f.img[I[s + n]]))) {
            const v = ang(W(f, s, 'hip'), W(f, s, 'kn'), W(f, s, 'an'));
            if (v != null) a.push(v);
          }
        }
        return a.length ? { value: avg(a) } : null;
      },
      quality: (min) => 100 * (0.3 + 0.7 * clamp((135 - min) / 45)),
    });
  }

  function pushupKnee() {
    return repDetector({
      alpha: 0.5, down: 105, up: 150, coach: 'turun lebih rendah, badan lurus',
      measure(f) {
        const s = bestSide(f, ['sh', 'el', 'wr', 'hip', 'kn']);
        if (!s) return null;
        const el = ang(W(f, s, 'sh'), W(f, s, 'el'), W(f, s, 'wr'));
        const body = ang(W(f, s, 'sh'), W(f, s, 'hip'), W(f, s, 'kn'));
        if (el == null || body == null) return null;
        return { value: el, aux: clamp(1 - (Math.abs(180 - body) - 12) / 35) };
      },
      quality: (min, aux) => 100 * (0.2 + 0.8 * (0.6 * clamp((120 - min) / 35) + 0.4 * avg(aux))),
    });
  }

  function lunge() {
    return repDetector({
      alpha: 0.5, down: 125, up: 155, coach: 'turun lebih dalam',
      measure(f) {
        const a = [];
        for (const s of ['l', 'r']) {
          if (['hip', 'kn', 'an'].every((n) => vis(f.img[I[s + n]]))) {
            const v = ang(W(f, s, 'hip'), W(f, s, 'kn'), W(f, s, 'an'));
            if (v != null) a.push(v);
          }
        }
        return a.length ? { value: Math.min(...a) } : null;
      },
      quality: (min) => 100 * (0.3 + 0.7 * clamp((135 - min) / 35)),
    });
  }

  // openness 0..1 from arm height (image) and foot spread (world); signal = 1 - openness
  function jackPelan() {
    return repDetector({
      alpha: 0.6, down: 0.5, up: 0.7, coach: 'angkat tangan lebih tinggi & kaki lebih lebar',
      measure(f) {
        const need = ['lsh', 'rsh', 'lwr', 'rwr', 'lhip', 'rhip', 'lan', 'ran'];
        if (!need.every((n) => vis(f.img[I[n]]))) return null;
        const g = (n) => f.img[I[n]];
        const torso = Math.abs((g('lsh').y + g('rsh').y) / 2 - (g('lhip').y + g('rhip').y) / 2) * f.h;
        if (!torso) return null;
        const armH = avg([g('lsh').y - g('lwr').y, g('rsh').y - g('rwr').y]) * f.h / torso;
        const sw = dist3(f.world[I.lsh], f.world[I.rsh]);
        if (!sw) return null;
        const r = dist3(f.world[I.lan], f.world[I.ran]) / sw;
        const o = 0.5 * clamp((armH + 0.2) / 0.9) + 0.5 * clamp((r - 0.9) / 0.7);
        return { value: 1 - o };
      },
      quality: (min) => 100 * (0.4 + 0.6 * clamp((1 - min - 0.55) / 0.35)),
    });
  }

  function plank(window) {
    return holdDetector({
      window, afterMsg: 'Lanjut side plank — bagian ini tidak dinilai kamera',
      measure(f) {
        const s = bestSide(f, ['sh', 'hip', 'an']);
        if (!s) return null;
        const a = ang(W(f, s, 'sh'), W(f, s, 'hip'), W(f, s, 'an'));
        if (a == null) return null;
        const dev = Math.abs(180 - a);
        const sh = f.img[I[s + 'sh']], hip = f.img[I[s + 'hip']], an = f.img[I[s + 'an']];
        const dx = (an.x - sh.x) * f.w, dy = (an.y - sh.y) * f.h;
        const len = Math.hypot(dx, dy);
        if (!len) return null;
        const horizontal = Math.abs(dy) < 0.6 * len;
        const t = Math.abs(an.x - sh.x) > 1e-4 ? (hip.x - sh.x) / (an.x - sh.x) : 0.5;
        const yLine = sh.y + t * (an.y - sh.y);
        const sag = ((hip.y - yLine) * f.h) / len; // + = hip below the line
        const good = dev <= 18 && horizontal;
        let msg = 'Postur lurus — tahan! 💪';
        if (!horizontal) msg = 'Posisi plank dulu (HP dari samping)';
        else if (!good) msg = sag > 0 ? 'Pinggul terlalu turun' : 'Pinggul terlalu naik';
        return { good, msg };
      },
    });
  }

  const REGISTRY = {
    'march_jack:normal': { make: jackPelan, view: 'HP di depan, berdiri ±2 m, seluruh badan masuk frame', label: 'Jumping jack' },
    'squat:normal': { make: squat, view: 'HP di depan atau miring 45°, seluruh badan masuk frame', label: 'Squat' },
    'pushup:normal': { make: pushupKnee, view: 'HP di samping badan, setinggi lantai', label: 'Push-up' },
    'plank:normal': { make: () => plank([0, 20]), view: 'HP di samping badan, setinggi lantai (20 dtk pertama dinilai)', label: 'Plank' },
    'lunge:normal': { make: lunge, view: 'HP di samping atau depan, seluruh badan masuk frame', label: 'Lunge' },
  };

  const api = {
    has: (ex, lv) => !!REGISTRY[ex + ':' + lv],
    view: (ex, lv) => (REGISTRY[ex + ':' + lv] || {}).view,
    create(ex, lv) {
      const r = REGISTRY[ex + ':' + lv];
      if (!r) return null;
      const d = r.make();
      d.view = r.view;
      return d;
    },
    REGISTRY, I,
  };
  root.FitDetectors = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* FitQuest — pixel art generator: avatar (height/weight/hair/clothes/muscle stages), mood persons, monsters, weapons. */
(function (root) {
  'use strict';
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rgb = (h) => { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
  const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

  class Buf {
    constructor(w, h) { this.w = w; this.h = h; this.p = new Array(w * h).fill(null); this.anchors = null; }
    get(x, y) { return x < 0 || y < 0 || x >= this.w || y >= this.h ? null : this.p[y * this.w + x]; }
    set(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.p[y * this.w + x] = c; }
    setM(x, y, c) { this.set(x, y, c); this.set(this.w - 1 - Math.round(x), y, c); }
    rect(x, y, w, h, c, m) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) (m ? this.setM : this.set).call(this, x + i, y + j, c); }

  const SKINS = ['#f3cfae', '#dba274', '#b57a4e', '#7b4c30'];

  function palette(skin, hair, shirt) {

      k: skin, kh: mix(skin, '#ffffff', 0.2), ks: mix(skin, '#000000', 0.22), l: mix(skin, '#000000', 0.4), h: mix(skin, '#ffffff', 0.3),

      x: '#f2f2f2', xs: '#7d8594',

  const GROUPS = {

    paha: { name: 'Paha', full: 'Paha & bokong', muscles: ['quads', 'hamstrings', 'glutes'] },

  const STAGE_EVERY = 5, MAX_STAGE = 10;

  function build(o) {

  /* labels hanging off the sides of the avatar, each with a line to its muscle area */
  function pointers(box, B, stagger) {
    const cv = $('canvas.av', box); if (!cv) return;
    const cr = cv.getBoundingClientRect(), br = box.getBoundingClientRect();
    if (!cr.width) return;
    box.querySelectorAll('.tag,svg.pl').forEach((e) => e.remove());
    const sx = cr.width / B.w, sy = cr.height / B.h, ox = cr.left - br.left, oy = cr.top - br.top, TW = 74, TH = 44;
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'pl'); svg.setAttribute('width', br.width); svg.setAttribute('height', br.height);
    box.appendChild(svg);
    let n = 0;
    ['l', 'r'].forEach((side) => {
      const arr = Object.entries(B.anchors).filter(([, a]) => a.side === side).map(([k, a]) => ({ k, ax: ox + (a.x + 0.5) * sx, ay: oy + (a.y + 0.5) * sy })).sort((p, q) => p.ay - q.ay);
      let prev = -99; arr.forEach((it) => { it.ty = Math.max(it.ay, prev + TH + 4, TH / 2); prev = it.ty; });
      for (let i = arr.length - 1, lim = br.height - TH / 2; i >= 0; i--) { arr[i].ty = Math.min(arr[i].ty, lim); lim = arr[i].ty - TH - 4; }
      arr.forEach((it) => {
        const g = gInfo(it.k), d = (stagger ? n * 0.28 : 0) + 's';
        const b = document.createElement('button'); b.className = 'tag ' + side + (stagger ? ' pop' : ''); b.dataset.g = it.k; b.style.top = (it.ty - TH / 2) + 'px'; b.style.animationDelay = d;
        b.innerHTML = `<span>${AV.GROUPS[it.k].name}</span><b>Lv ${g.L}</b><em class="tb"><i style="width:${Math.round(g.pct * 100)}%"></i></em>`;
        box.appendChild(b);
        const ex = side === 'l' ? TW : br.width - TW;
        const ln = document.createElementNS(NS, 'path'); ln.setAttribute('d', `M${ex} ${it.ty} L${(ex + it.ax) / 2} ${it.ty} L${it.ax} ${it.ay}`); ln.setAttribute('class', 'pln' + (stagger ? ' draw' : '')); ln.style.animationDelay = d; svg.appendChild(ln);
        const dot = document.createElementNS(NS, 'rect'); dot.setAttribute('x', it.ax - 3); dot.setAttribute('y', it.ay - 3); dot.setAttribute('width', 6); dot.setAttribute('height', 6); dot.setAttribute('class', 'pdot' + (stagger ? ' draw' : '')); dot.style.animationDelay = d; svg.appendChild(dot);
        b.onclick = () => {
          const gg = gInfo(it.k), nxt = AV.nextStageLevel(gg.L);
          toast(`${AV.GROUPS[it.k].full} Lv ${gg.L} — ${Math.round(gg.pct * 100)}% ke Lv ${gg.L + 1}.` + (nxt ? ` Bentuk berikutnya di Lv ${nxt}.` : ' Sudah bentuk maksimal!'));
        };
        n++;
      });
    });
  }
  const watchPointers = (box, B) => { const f = () => { if (document.body.contains(box)) pointers(box, B, false); }; window.addEventListener('resize', f); };

      const B = AV.build({ height: clampN(cur.h, 120, 220), weight: clampN(cur.w, 30, 200), skin: cur.skin, gender: cur.gender, hair: cur.hair, shirt: cur.shirt, stages: editing && S.body ? Object.fromEntries(GKEYS.map((k) => [k, AV.stageOf(gInfo(k).L)])) : {} });
      AV.draw($('#sil'), B, { pal: AV.palette(cur.skin, cur.hairColor, cur.shirtColor) });
    };
    redraw();
    const read = () => { cur.h = parseInt($('#ih').value, 10) || cur.h; cur.w = parseInt($('#iw').value, 10) || cur.w; };
    $('#ih').oninput = $('#iw').oninput = () => { read(); redraw(); };
    app.querySelectorAll('.stepper button').forEach((b) => (b.onclick = () => {
      const f = b.dataset.f, el = $(f === 'h' ? '#ih' : '#iw');
      el.value = clampN((parseInt(el.value, 10) || cur[f]) + parseInt(b.dataset.d, 10), f === 'h' ? 120 : 30, f === 'h' ? 220 : 200);
      read(); redraw(); beep(520, 0.03);

    const wire = (id, prop, attr) => app.querySelectorAll(`#${id} button`).forEach((b) => (b.onclick = () => { cur[prop] = b.dataset[attr]; app.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle('on', x === b)); redraw(); beep(520, 0.03); }));
    wire('genders', 'gender', 'v'); app.querySelectorAll('#genders button').forEach((b) => b.addEventListener('click', () => { const sw = cur.gender === 'f' ? ['pendek', 'panjang'] : ['panjang', 'pendek']; if (cur.hair === sw[0]) { cur.hair = sw[1]; app.querySelectorAll('#hairs button').forEach((x) => x.classList.toggle('on', x.dataset.v === sw[1])); redraw(); } })); wire('skins', 'skin', 's'); wire('hcols', 'hairColor', 's'); wire('scols', 'shirtColor', 's'); wire('hairs', 'hair', 'v'); wire('shirts', 'shirt', 'v');
    if (editing) $('#cancel').onclick = back || home;
    $('#go').onclick = () => {

      S.name = nm || S.name || 'Pahlawan';

    if (done) return { cls: 'ok', t: 'Hari ini sudah. Tapi zombie nggak berhenti.', s: nextZ ? `${nextZ.name} butuh Lv ${nextZ.rec}. Kamu Lv ${L}. Tambah lagi?` : 'Kamu sudah menguasai semua zona. Pertahankan.' };
    if (S.lastDay === yesterday() && S.streak > 0) return { cls: 'hot', t: `🔥 Streak ${S.streak} hari bakal HANGUS malam ini.`, s: 'Kamu mau buang semuanya buat 10 menit rebahan?' };
    const pool = [

  /* ---- skill tree ---- */
  function skillTree(wid) {
    stopCamp(); bumpGear(); wid = wid || S.gear.weapon;
    const g = groupLevels(), w = G.weaponOf(wid), nodes = G.SKILLS[wid] || [], un = G.unlockedSkills(wid, g).map((n) => n.id);
    const own = S.gear.owned.includes(wid), eq = S.gear.weapon === wid;
    const node = (n) => {
      const ok = un.includes(n.id), kids = nodes.filter((q) => q.parent === n.id), gl = g[n.req[0]], par = n.parent ? nodes.find((q) => q.id === n.parent) : null;
      const need = ok ? 'Terbuka' : gl < n.req[1] ? `${G.GROUP_NAME[n.req[0]]} Lv ${n.req[1]} (kamu Lv ${gl})` : `Buka dulu: ${par.name}`;
      return `<li><div class="sn ${ok ? 'ok' : 'lk'}"><span class="se">${ok ? n.em : '🔒'}</span><div class="sb"><b>${n.name}</b><div class="mut small">${n.desc}</div><div class="small sreq ${ok ? 'g' : ''}">${need} · jeda ${n.cd}d</div></div></div>${kids.length ? `<ul>${kids.map(node).join('')}</ul>` : ''}</li>`;
    };
    const root = nodes.filter((n) => !n.parent);
    app.innerHTML = `
    <div class="hdr"><button class="ibtn" id="back" aria-label="Kembali">‹</button><div><h1>Skill Tree</h1><p>Terbuka lewat level otot, bukan dibeli.</p></div></div>
    <div class="wtabs">${G.WEAPONS.map((x) => `<button class="wtab ${x.id === wid ? 'on' : ''}" data-w="${x.id}"><span>${x.em}</span><small>${x.name}</small></button>`).join('')}</div>
    <section class="card"><b>${w.em} ${w.name}</b><div class="mut small">${w.blurb}</div>
      <ul class="stree">${root.map(node).join('')}</ul>
      ${eq ? '<div class="tagok" style="margin-top:10px">Sedang dipakai</div>' : own ? `<button class="btn big" id="wuse" style="margin-top:12px">Pakai senjata ini</button>` : `<button class="btn big ${S.scrap >= w.cost ? '' : 'dis'}" id="wbuy" style="margin-top:12px">Beli 🔩${w.cost}</button>`}</section>`;
    $('#back').onclick = shop;
    app.querySelectorAll('.wtab').forEach((b) => (b.onclick = () => skillTree(b.dataset.w)));
    if ($('#wuse')) $('#wuse').onclick = () => { S.gear.weapon = wid; save(); skillTree(wid); };
    if ($('#wbuy')) $('#wbuy').onclick = () => { if (S.scrap < w.cost) { toast(`Scrap kurang ${w.cost - S.scrap}. Latihan dulu — tiap sesi nambah scrap.`); return; } S.scrap -= w.cost; S.gear.owned.push(wid); S.gear.weapon = wid; save(); beep(900, 0.1); skillTree(wid); };
    window.scrollTo(0, 0);
  }

  /* ---- gudang ---- */
  function shop() {
    stopCamp(); bumpGear();
    const g = groupLevels();
    const row = (kind, it) => {
      const own = S.gear.owned.includes(it.id), eq = S.gear[kind] === it.id;
      const stat = kind === 'weapon' ? `⚔ +${it.dmg} · ${(G.SKILLS[it.id] || []).length} skill` : `🛡 +${it.def}`;
      const unl = kind === 'weapon' ? G.unlockedSkills(it.id, g).length : 0;
      return `<div class="witem"><div class="item ${eq ? 'eq' : ''}"><div><b>${it.em ? it.em + ' ' : ''}${it.name}</b><div class="mut small">${kind === 'weapon' ? it.blurb : stat}</div>${kind === 'weapon' ? `<div class="mut small">${stat} · terbuka ${unl}</div>` : ''}</div>
        ${eq ? '<span class="tagok">Dipakai</span>' : own ? `<button class="btn mini" data-eq="${kind}:${it.id}">Pakai</button>` : `<button class="btn mini ${S.scrap >= it.cost ? '' : 'dis'}" data-buy="${kind}:${it.id}">🔩${it.cost}</button>`}</div>
        ${kind === 'weapon' ? `<button class="btn ghost mini wide" data-tree="${it.id}">🌳 Lihat skill tree</button>` : ''}</div>`;
    };
    app.innerHTML = `
    <div class="hdr"><button class="ibtn" id="back" aria-label="Kembali">‹</button><div><h1>Gudang</h1><p>Scrap: <b>🔩${fmt(S.scrap)}</b>. Semua senjata harganya sama dan sama kuat — yang beda skill tree-nya.</p></div></div>
    <h3 class="sec">Senjata</h3><section class="card items">${G.WEAPONS.map((w) => row('weapon', w)).join('')}</section>
    <h3 class="sec">Pelindung</h3><section class="card items">${G.ARMORS.map((a) => row('armor', a)).join('')}</section>`;
    $('#back').onclick = home;
    app.querySelectorAll('[data-tree]').forEach((b) => (b.onclick = () => skillTree(b.dataset.tree)));
    app.querySelectorAll('[data-buy]').forEach((b) => (b.onclick = () => {
      const [kind, id] = b.dataset.buy.split(':'), it = (kind === 'weapon' ? G.WEAPONS : G.ARMORS).find((x) => x.id === id);
      if (S.scrap < it.cost) { toast(`Scrap kurang ${it.cost - S.scrap}. Latihan dulu — tiap sesi nambah scrap.`); return; }
      S.scrap -= it.cost; S.gear.owned.push(id); S.gear[kind] = id; save(); beep(900, 0.1); shop();
    }));
    app.querySelectorAll('[data-eq]').forEach((b) => (b.onclick = () => { const [kind, id] = b.dataset.eq.split(':'); S.gear[kind] = id; save(); shop(); }));
    window.scrollTo(0, 0);
  }

  function summary(run, t) {
    stopCamp();
    const li = levelInfo(S.totalXp), upL = li.L - run.before.L;
    const after = groupLevels(), before = run.before.g;
    const changed = GKEYS.filter((k) => AV.stageOf(after[k]) > AV.stageOf(before[k]));
    const pal = palOf();
    const newZ = G.ZONES.filter((z) => z.rec > run.before.L && z.rec <= li.L);
    app.innerHTML = `
    <div class="hdr"><div><h1>${t.early ? 'Lumayan!' : 'Selesai! 🎉'}</h1><p>${changed.length ? 'Badanmu berubah!' : 'Satu langkah lagi ke versi kuatmu.'}</p></div></div>
    <section class="card center"><div class="xp">+${fmt(t.total)} XP</div><div class="scrapgain">+🔩${t.scrap} scrap</div>
      ${upL > 0 ? `<div class="lvlup">⬆ LEVEL UP! Sekarang Lv ${li.L} — ${titleOf(li.L)}</div>` : ''}
      ${newZ.length ? `<div class="lvlup">🔓 Zona terbuka: ${newZ.map((z) => z.name).join(', ')}</div>` : ''}
      <div class="bar"><i style="width:${(li.cur / li.need) * 100}%"></i></div><div class="barlbl"><span>Lv ${li.L}</span><span>${fmt(li.cur)} / ${fmt(li.need)} XP</span></div></section>
    <section class="card center">
      ${changed.length ? `<div class="chip p" style="display:inline-block;margin-bottom:6px">OTOT BERKEMBANG: ${changed.map((k) => AV.GROUPS[k].name).join(', ')}</div>
        <div class="ba"><canvas id="avb" class="pix"></canvas><span class="arrow">→</span><canvas id="ava" class="pix after"></canvas></div>`
        : '<div class="ba"><canvas id="ava" class="pix"></canvas></div>'}
      ${GKEYS.map((k) => { const g = gInfo(k); const up = after[k] > before[k]; return `<div class="grow"><span class="gn">${AV.GROUPS[k].name}</span><div class="bar sm"><i style="width:${Math.round(g.pct * 100)}%"></i></div><b class="${up ? 'g' : ''}">Lv ${g.L}${up ? '↑' : ''}</b></div>`; }).join('')}
    </section>
    <section class="card rows"><div><span>Latihan</span><b>${t.base}</b></div><div><span>📷 Bonus kamera</span><b class="g">+${t.camB}</b></div>
      <div><span>🔥 Streak ${S.streak} hari</span><b class="g">+${t.streakB}</b></div><div><span>🌅 Bonus harian</span><b class="g">+${t.dailyB}</b></div></section>
    <h3 class="sec">Rincian gerakan</h3>
    <section class="card steps">${run.results.map((r) => `<div class="stp"><span class="em">${EMOJI[r.exercise]}</span><div><div>${r.exName}</div><div class="mut small">${r.lvName}</div></div>
      <div class="rt2">${r.score != null ? `<b class="${r.score >= 80 ? 'g' : r.score >= 55 ? 'o' : 'r'}">Form ${r.score}</b><small>${r.reps != null ? r.reps + ' rep · ' : ''}+${r.bonus} XP</small>` : `<small>${r.tried ? 'kamera kurang lihat' : 'tanpa kamera'}</small>`}</div></div>`).join('')}</section>
    <button class="btn big" id="ok">Balik ke kamp</button>`;
    AV.draw($('#ava'), avatarBuf(after), { pal });
    if (changed.length) AV.draw($('#avb'), avatarBuf(before), { pal });
    $('#ok').onclick = home;
    if (upL > 0 || changed.length) { beep(800, 0.15); setTimeout(() => beep(1100, 0.25), 180); }
    window.scrollTo(0, 0);
  }

  function settings() {
    stopCamp();
    const lv = groupLevels();
    app.innerHTML = `
    <div class="hdr"><button class="ibtn" id="back" aria-label="Kembali">‹</button><div><h1>Pengaturan</h1></div></div>
    <section class="card tog"><label><span>📷 Bonus kamera</span><input type="checkbox" id="tcam" ${S.settings.camera ? 'checked' : ''}></label>
      <label><span>🔊 Suara pemandu</span><input type="checkbox" id="tvoice" ${S.settings.voice ? 'checked' : ''}></label></section>
    <section class="card tog"><label><span>🎵 Musik latar</span><input type="checkbox" id="tmusic" ${S.settings.music !== false ? 'checked' : ''}></label>
      <div class="slrow"><span>Volume</span><b id="volv"></b></div><input type="range" id="vol" min="0" max="100" step="5" value="${Math.round((S.settings.vol == null ? 0.7 : S.settings.vol) * 100)}">
      <p class="mut small">Tiap suasana punya lagu sendiri: Lemes pelan, Siap ceria, Membara kencang, plus lagu khusus untuk game dan kamp.</p></section>
    <section class="card"><div class="slrow"><span>⏱ Waktu istirahat antar gerakan</span><b id="restv"></b></div>
      <input type="range" id="rest" min="0" max="90" step="5" value="${S.settings.rest || 0}"><p class="mut small">Geser ke 0 untuk mengikuti menu (ringan, normal, berat punya waktu sendiri).</p></section>
    <section class="card"><div>${nameOf()}: <b>${S.body.h} cm · ${S.body.w} kg</b></div><p class="mut small">Latihan: ${S.sessions} · Streak terbaik: ${S.best} hari</p><button class="btn ghost" id="edit" style="margin-top:10px">Ubah nama, badan & penampilan</button></section>
    <h3 class="sec">Uji avatar (preview saja)</h3>
    <section class="card center"><canvas id="pv" class="pix" style="height:260px;width:auto"></canvas>
      <p class="mut small">Geser level tiap otot untuk lihat bentuknya. Progresmu tidak berubah.<br>Bentuk avatar berubah tiap ${AV.STAGE_EVERY} level (Lv 5, 10, … 50).</p>
      <div style="text-align:left">${GKEYS.map((k) => `<div class="slrow"><span>${AV.GROUPS[k].name}</span><b id="pv_${k}"></b></div><input type="range" data-g="${k}" min="1" max="${MAXL}" step="1" value="${Math.min(MAXL, lv[k])}">`).join('')}</div></section>
    <button class="btn ghost danger" id="reset">Hapus semua progres</button>`;
    const pal = palOf();
    const volTxt = () => { $('#volv').textContent = $('#vol').value + '%'; };
    volTxt(); $('#vol').oninput = () => { volTxt(); S.settings.vol = $('#vol').value / 100; MU.setVolume(S.settings.vol); }; $('#vol').onchange = save;
    $('#tmusic').onchange = (e) => { S.settings.music = e.target.checked; save(); MU.setEnabled(e.target.checked); };
    const restTxt = () => { const v = parseInt($('#rest').value, 10); $('#restv').textContent = v ? v + ' detik' : 'ikuti menu'; };
    restTxt(); $('#rest').oninput = restTxt; $('#rest').onchange = () => { S.settings.rest = parseInt($('#rest').value, 10) || 0; save(); };
    const prev = () => { const t = {}; app.querySelectorAll('input[data-g]').forEach((r) => { t[r.dataset.g] = parseInt(r.value, 10); $('#pv_' + r.dataset.g).textContent = `Lv ${r.value} · bentuk ${AV.stageOf(t[r.dataset.g])}/${AV.MAX_STAGE}`; }); AV.draw($('#pv'), avatarBuf(t), { pal }); };
    prev(); app.querySelectorAll('input[data-g]').forEach((r) => (r.oninput = prev));
    $('#back').onclick = home;
    $('#tcam').onchange = (e) => { S.settings.camera = e.target.checked; save(); };
    $('#tvoice').onchange = (e) => { S.settings.voice = e.target.checked; save(); };
    $('#edit').onclick = () => onboarding(true, settings);
    $('#reset').onclick = () => askConfirm('Yakin hapus semua progres dan mulai dari awal?', 'Hapus semua', () => { S = defaults(); save(); home(); });
  }

  /* ---------------- boot ---------------- */
  window.__fq = { music: MU, skillTree, askConfirm, gameMenu, shop, battle, bodyView, state: () => S, buildTimeline, levelInfo, mLevel, routineStats, tick, startWorkout, home, onboarding, revealScreen, settings, groupLevels, gInfo, runner: () => R };
  applyMusic();
  home();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
</body>
</html>
